# requirements.lock -- the VERIFICATION environment, env-004.
#
# Exact output of `pip freeze --all` in the virtualenv under which the
# following were reproduced on 2026-10-12 (see ENVIRONMENT.md env-004 and
# DECISION_LOG.md D052):
#
#   - the primary endpoint, to -4.2e-09 of the recorded value, from the 25
#     stored checkpoints;
#   - the sequence-leakage distribution over 2,000 splits, exactly;
#   - the 165,574-row predictor comparison and all four predictor
#     intervals, exactly.
#
# This is NOT the environment the checkpoints were TRAINED in. That was
# env-002/env-003: Python 3.13.15, torch 2.11.0+cu130 on a Tesla T4. The
# checkpoints cannot be regenerated from this file, and no claim is made
# that they can. They are inputs here, verified by hash.
#
# Python 3.14.4
# Platform Linux-7.0.0-38-generic-x86_64-with-glibc2.43
#
# Installing this set.
#
# `torch==2.14.1+cpu` carries a local version tag and is published on the
# PyTorch CPU wheel index, not on PyPI, so a plain
# `pip install -r requirements.lock` is not expected to resolve it. The index is
# the one requirements.txt already documents:
#
#   python3.14 -m venv .venv
#   .venv/bin/pip install -r requirements.lock \
#       --extra-index-url https://download.pytorch.org/whl/cpu
#
# **This command was not executed when this file was written** — doing so would
# have altered the environment being recorded. It is given as the installation
# route implied by the pinned versions and by requirements.txt, not as a tested
# command. Anyone rebuilding this environment should expect to verify it.
#
# On a machine with CUDA, install torch separately rather than from this file,
# and expect differences in the last few decimal places of any float
# accumulation.
#
