<svg xmlns="http://www.w3.org/2000/svg" width="880" height="303" viewBox="0 0 880 303" class="viz" role="img" aria-labelledby="t d"><title id="t">The primary endpoint, read once, and its two checks</title><desc id="d">Mean per-participant average precision, nominal-99% cluster bootstrap over participants. Grey dots are the 10 held-out participants.</desc><defs><style>
  .viz{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;
       --grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;
       --s1lo:#86b6ef;--neg:#e34948;
       font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  @media (prefers-color-scheme:dark){
    .viz:not([data-theme="light"]){--surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;
       --muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;
       --s3:#199e70;--s1lo:#184f95;--neg:#e66767}}
  .viz[data-theme="dark"]{--surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;
       --muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;
       --s3:#199e70;--s1lo:#184f95;--neg:#e66767}
  .bg{fill:var(--surface)}
  .ttl{fill:var(--ink);font-size:15px;font-weight:600}
  .sub{fill:var(--ink2);font-size:11.5px}
  .cat{fill:var(--ink);font-size:12px}
  .val{fill:var(--ink);font-size:11.5px;font-weight:600;
       font-variant-numeric:tabular-nums}
  .ci{fill:var(--ink2);font-size:10.5px;font-variant-numeric:tabular-nums}
  .tick{fill:var(--muted);font-size:10.5px;font-variant-numeric:tabular-nums}
  .note{fill:var(--muted);font-size:10.5px}
  .ref{fill:var(--ink2);font-size:10.5px;font-weight:600}
  .grid{stroke:var(--grid);stroke-width:1}
  .axis{stroke:var(--axis);stroke-width:1}
  .refline{stroke:var(--axis);stroke-width:1}
  .ring{stroke:var(--surface);stroke-width:2}
</style></defs><rect class="bg" width="880" height="303"/><text x="28.0" y="26.0" class="ttl" text-anchor="start">The primary endpoint, read once, and its two checks</text><text x="28.0" y="44.0" class="sub" text-anchor="start">Mean per-participant average precision, nominal-99% cluster bootstrap over participants. Grey dots are the 10 held-out participants.</text><line class="grid" x1="366.3" y1="81.0" x2="366.3" y2="191.0"/><text x="366.3" y="206.0" class="tick" text-anchor="middle">0.6</text><line class="grid" x1="446.7" y1="81.0" x2="446.7" y2="191.0"/><text x="446.7" y="206.0" class="tick" text-anchor="middle">0.65</text><line class="grid" x1="527.0" y1="81.0" x2="527.0" y2="191.0"/><text x="527.0" y="206.0" class="tick" text-anchor="middle">0.7</text><line class="grid" x1="607.4" y1="81.0" x2="607.4" y2="191.0"/><text x="607.4" y="206.0" class="tick" text-anchor="middle">0.75</text><line class="grid" x1="687.7" y1="81.0" x2="687.7" y2="191.0"/><text x="687.7" y="206.0" class="tick" text-anchor="middle">0.8</text><line class="axis" x1="286" y1="191.0" x2="752" y2="191.0"/><text x="519.0" y="222.0" class="note" text-anchor="middle">mean per-participant average precision</text><line class="refline" x1="361.5" y1="79.0" x2="361.5" y2="191.0"/><text x="361.5" y="75.0" class="ref" text-anchor="middle">floor 0.597</text><line class="refline" x1="441.9" y1="93.0" x2="441.9" y2="191.0"/><text x="441.9" y="89.0" class="ref" text-anchor="middle">threshold 0.647</text><circle cx="585.2" cy="105.0" r="2.5" fill="var(--muted)" opacity="0.45"/><circle cx="653.0" cy="105.0" r="2.5" fill="var(--muted)" opacity="0.45"/><circle cx="599.6" cy="105.0" r="2.5" fill="var(--muted)" opacity="0.45"/><circle cx="622.6" cy="105.0" r="2.5" fill="var(--muted)" opacity="0.45"/><circle cx="673.4" cy="105.0" r="2.5" fill="var(--muted)" opacity="0.45"/><circle cx="609.3" cy="105.0" r="2.5" fill="var(--muted)" opacity="0.45"/><circle cx="635.3" cy="105.0" r="2.5" fill="var(--muted)" opacity="0.45"/><circle cx="543.4" cy="105.0" r="2.5" fill="var(--muted)" opacity="0.45"/><circle cx="608.5" cy="105.0" r="2.5" fill="var(--muted)" opacity="0.45"/><circle cx="625.1" cy="105.0" r="2.5" fill="var(--muted)" opacity="0.45"/><line x1="586.2" y1="105.0" x2="642.8" y2="105.0" stroke="var(--s1)" stroke-width="2" stroke-linecap="round"/><circle cx="615.6" cy="105.0" r="4.5" fill="var(--s1)" class="ring"/><text x="268.0" y="109.0" class="cat" text-anchor="end">Primary — full test partition</text><text x="762.0" y="106.0" class="val" text-anchor="start">0.7551</text><text x="762.0" y="118.0" class="ci" text-anchor="start">[0.7368, 0.7721]</text><circle cx="507.4" cy="137.0" r="2.5" fill="var(--muted)" opacity="0.45"/><circle cx="562.3" cy="137.0" r="2.5" fill="var(--muted)" opacity="0.45"/><circle cx="520.3" cy="137.0" r="2.5" fill="var(--muted)" opacity="0.45"/><circle cx="553.7" cy="137.0" r="2.5" fill="var(--muted)" opacity="0.45"/><circle cx="570.3" cy="137.0" r="2.5" fill="var(--muted)" opacity="0.45"/><circle cx="528.7" cy="137.0" r="2.5" fill="var(--muted)" opacity="0.45"/><circle cx="548.2" cy="137.0" r="2.5" fill="var(--muted)" opacity="0.45"/><circle cx="494.2" cy="137.0" r="2.5" fill="var(--muted)" opacity="0.45"/><circle cx="509.0" cy="137.0" r="2.5" fill="var(--muted)" opacity="0.45"/><circle cx="565.9" cy="137.0" r="2.5" fill="var(--muted)" opacity="0.45"/><line x1="515.1" y1="137.0" x2="556.6" y2="137.0" stroke="var(--s1)" stroke-width="2" stroke-linecap="round"/><circle cx="536.0" cy="137.0" r="4.5" fill="var(--s1)" class="ring"/><text x="268.0" y="141.0" class="cat" text-anchor="end">Sensitivity — leakage-free subset</text><text x="762.0" y="138.0" class="val" text-anchor="start">0.7056</text><text x="762.0" y="150.0" class="ci" text-anchor="start">[0.6926, 0.7184]</text><circle cx="631.6" cy="169.0" r="4.5" fill="var(--s1)" class="ring"/><text x="268.0" y="173.0" class="cat" text-anchor="end">Secondary — score-ensembled</text><text x="762.0" y="170.0" class="val" text-anchor="start">0.7651</text><text x="762.0" y="182.0" class="ci" text-anchor="start">no interval</text><text x="28.0" y="235.0" class="note" text-anchor="start">The null is rejected when the lower bound clears 0.647, a rule fixed before any model existed (D008). It clears on the primary and again on the</text><text x="28.0" y="249.0" class="note" text-anchor="start">leakage-free subset, so the result does not rest on the 15.99% of test positives that also appear in training. The ensembled value carries no</text><text x="28.0" y="263.0" class="note" text-anchor="start">interval because it is a single ranking rather than 25, and it is reported as the flattering framing, which is why the per-model average was made</text><text x="28.0" y="277.0" class="note" text-anchor="start">primary before the partition was read (D027).</text></svg>