"var(--s1)" class="ring"/><text x="268.0" y="156.0" class="cat" text-anchor="end">HLA-C*07:02  (14 units)</text><text x="762.0" y="153.0" class="val" text-anchor="start">+0.0160</text><text x="762.0" y="165.0" class="ci" text-anchor="start">[+0.0048, +0.0269]</text><line x1="328.5" y1="184.0" x2="466.5" y2="184.0" stroke="var(--s1)" stroke-width="2" stroke-linecap="round"/><circle cx="406.0" cy="184.0" r="4.5" fill="var(--s1)" class="ring"/><text x="268.0" y="188.0" class="cat" text-anchor="end">HLA-A*01:01  (7 units)</text><text x="762.0" y="185.0" class="val" text-anchor="start">+0.0083</text><text x="762.0" y="197.0" class="ci" text-anchor="start">[-0.0100, +0.0226]</text><line x1="553.7" y1="216.0" x2="680.7" y2="216.0" stroke="var(--s1)" stroke-width="2" stroke-linecap="round"/><circle cx="621.7" cy="216.0" r="4.5" fill="var(--s1)" class="ring"/><text x="268.0" y="220.0" class="cat" text-anchor="end">HLA-A*24:02  (6 units)</text><text x="762.0" y="217.0" class="val" text-anchor="start">+0.0592</text><text x="762.0" y="229.0" class="ci" text-anchor="start">[+0.0432, +0.0732]</text><line x1="334.0" y1="248.0" x2="676.5" y2="248.0" stroke="var(--s1)" stroke-width="2" stroke-linecap="round"/><circle cx="508.3" cy="248.0" r="4.5" fill="var(--s1)" class="ring"/><text x="268.0" y="252.0" class="cat" text-anchor="end">HLA-B*07:02  (5 units)</text><text x="762.0" y="249.0" class="val" text-anchor="start">+0.0325</text><text x="762.0" y="261.0" class="ci" text-anchor="start">[-0.0087, +0.0722]</text><text x="28.0" y="314.0" class="note" text-anchor="start">Three of five exclude zero. A*01:01 is the case the nuisance estimate was built for: it reads +0.0229 raw and would have counted as a replication,</text><text x="28.0" y="328.0" class="note" text-anchor="start">but its two training sets differ in quality by +0.0146, and only +0.0083 survives. No joint p-value is computed — the five splits share participants.</text></svg>