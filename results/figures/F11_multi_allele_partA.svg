<svg xmlns="http://www.w3.org/2000/svg" width="880" height="354" viewBox="0 0 880 354" class="viz" role="img" aria-labelledby="t d"><title id="t">All five alleles point the same way once the nuisance is subtracted</title><desc id="d">Carrier-trained minus non-carrier-trained on each allele’s exclusive stratum, minus the same contrast on class-shared peptides, paired per participant.</desc><defs><style>
  .viz{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;
       --grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;
       --s1lo:#86b6ef;--neg:#e34948;
       font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
