<svg xmlns="http://www.w3.org/2000/svg" width="880" height="620" viewBox="0 0 880 620" class="viz" role="img" aria-labelledby="t d"><title id="t">Study design, from deposited submission to read endpoint</title><desc id="d">A deposited submission of 402 acquisitions, of which 222 are HLA class I over 52 participants, yields 2,658,972 unique peptides. A frozen dataset of 520,000 positives and 520,000 decoys is split into 42 participants for model selection and 10 held out. A 16-point grid and 25 checkpoints precede a single read of the held-out partition at 0.7551 average precision against a preregistered threshold of 0.647.</desc><defs><style>
  .viz{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;
       --grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;
       --s1lo:#86b6ef;--neg:#e34948;
       font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  @media (prefers-color-scheme:dark){
    .viz:not([data-theme="light"]){--surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;
       --muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;
       --s3:#199e70;--s1lo:#184f95;--neg:#e66767}}
  .viz[data-theme="dark"]{--surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;
       --muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;
       --s3:#199e70;--s1lo:#184f95;--neg:#e66767}
  .bg{fill:var(--surface)}
  .ttl{fill:var(--ink);font-size:15px;font-weight:600}
  .sub{fill:var(--ink2);font-size:11.5px}
  .cat{fill:var(--ink);font-size:12px}
  .val{fill:var(--ink);font-size:11.5px;font-weight:600;
       font-variant-numeric:tabular-nums}
  .ci{fill:var(--ink2);font-size:10.5px;font-variant-numeric:tabular-nums}
  .tick{fill:var(--muted);font-size:10.5px;font-variant-numeric:tabular-nums}
  .note{fill:var(--muted);font-size:10.5px}
  .ref{fill:var(--ink2);font-size:10.5px;font-weight:600}
  .grid{stroke:var(--grid);stroke-width:1}
  .axis{stroke:var(--axis);stroke-width:1}
  .refline{stroke:var(--axis);stroke-width:1}
  .ring{stroke:var(--surface);stroke-width:2}
</style></defs><rect class="bg" width="880" height="620"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--axis)"/></marker></defs><text x="28.0" y="26.0" class="ttl" text-anchor="start">Study design: everything left of the dashed line was fixed before the endpoint was read</text><text x="28.0" y="46.0" class="sub" text-anchor="start">Counts are read from the frozen artifacts, not transcribed. A blue outline marks an artifact under checksum.</text><rect x="28" y="76" width="318" height="56" rx="4" fill="var(--surface)" stroke="var(--grid)" stroke-width="1"/><text x="40" y="96" fill="var(--ink)" font-size="12.5" font-weight="600">Deposited submission  PXD024871</text><text x="40.0" y="113.0" class="cat" text-anchor="start">402 acquisitions · 222 HLA class I · 52 participants</text><text x="40.0" y="128.0" class="cat" text-anchor="start">identifications taken as deposited, 5% class-I FDR</text><text x="360.0" y="98.0" class="ref" text-anchor="start">no new mass spectrometry</text><text x="360.0" y="114.0" class="note" text-anchor="start">exact joins only; approximate matching prohibited</text><path d="M68 132 L68 154" stroke="var(--axis)" stroke-width="1.5" fill="none" marker-end="url(#a)"/><rect x="28" y="158" width="318" height="56" rx="4" fill="var(--surface)" stroke="var(--grid)" stroke-width="1"/><text x="40" y="178" fill="var(--ink)" font-size="12.5" font-weight="600">Peptide extraction</text><text x="40.0" y="195.0" class="cat" text-anchor="start">2,658,972 unique peptides, 8–12 residues</text><text x="40.0" y="210.0" class="cat" text-anchor="start">every container checksum-verified before use</text><text x="360.0" y="192.0" class="note" text-anchor="start">79.9% of the union occurs in one participant only</text><path d="M68 214 L68 236" stroke="var(--axis)" stroke-width="1.5" fill="none" marker-end="url(#a)"/><rect x="28" y="240" width="318" height="56" rx="4" fill="var(--surface)" stroke="var(--s1)" stroke-width="1.5"/><text x="40" y="260" fill="var(--ink)" font-size="12.5" font-weight="600">Frozen dataset</text><text x="40.0" y="277.0" class="cat" text-anchor="start">520,000 positives (10,000 per participant) + 520,000 decoys</text><text x="40.0" y="292.0" class="cat" text-anchor="start">decoys from 20,152 of 20,652 expressed proteins, 1:1</text><text x="360.0" y="274.0" class="note" text-anchor="start">decoy set chosen on a composition diagnostic</text><path d="M68 296 L68 318" stroke="var(--axis)" stroke-width="1.5" fill="none" marker-end="url(#a)"/><rect x="28" y="322" width="318" height="56" rx="4" fill="var(--surface)" stroke="var(--s1)" stroke-width="1.5"/><text x="40" y="342" fill="var(--ink)" font-size="12.5" font-weight="600">Split, stratified by platform</text><text x="40.0" y="359.0" class="cat" text-anchor="start">42 participants for selection · 10 held out</text><text x="40.0" y="374.0" class="cat" text-anchor="start">14.59% mean sequence leakage over 2,000 splits</text><text x="360.0" y="356.0" class="note" text-anchor="start">not re-drawn: choosing on leakage is selection</text><path d="M68 378 L68 400" stroke="var(--axis)" stroke-width="1.5" fill="none" marker-end="url(#a)"/><rect x="28" y="404" width="318" height="56" rx="4" fill="var(--surface)" stroke="var(--s1)" stroke-width="1.5"/><text x="40" y="424" fill="var(--ink)" font-size="12.5" font-weight="600">Preregistered decision rule</text><text x="40.0" y="441.0" class="cat" text-anchor="start">reject when the nominal-99% lower bound exceeds 0.647</text><text x="40.0" y="456.0" class="cat" text-anchor="start">floor + 0.05; power 0.98 at AUROC 0.75</text><rect x="452" y="76" width="390" height="56" rx="4" fill="var(--surface)" stroke="var(--grid)" stroke-width="1"/><text x="464" y="96" fill="var(--ink)" font-size="12.5" font-weight="600">Measured before any model was fitted</text><text x="464.0" y="113.0" class="cat" text-anchor="start">composition floor · sequence leakage</text><text x="464.0" y="128.0" class="cat" text-anchor="start">platform separability · decoy contamination</text><text x="464.0" y="150.0" class="note" text-anchor="start">Figure 2. Each bounds what the endpoint can mean.</text><line x1="426" y1="168" x2="426" y2="546" stroke="var(--s2)" stroke-width="1.5" stroke-dasharray="4 3"/><text x="432.0" y="184.0" class="ref" text-anchor="start">the endpoint is read once, after this line</text><rect x="452" y="162" width="390" height="56" rx="4" fill="var(--surface)" stroke="var(--grid)" stroke-width="1"/><text x="464" y="182" fill="var(--ink)" font-size="12.5" font-weight="600">Model selection</text><text x="464.0" y="199.0" class="cat" text-anchor="start">16-point grid over 5 grouped folds</text><text x="464.0" y="214.0" class="cat" text-anchor="start">selected at 0.7525 mean validation AP</text><text x="464.0" y="236.0" class="note" text-anchor="start">grid spread 0.0129 against fold spread 0.0117 — flat</text><rect x="452" y="266" width="390" height="56" rx="4" fill="var(--surface)" stroke="var(--grid)" stroke-width="1"/><text x="464" y="286" fill="var(--ink)" font-size="12.5" font-weight="600">Final fit</text><text x="464.0" y="303.0" class="cat" text-anchor="start">25 checkpoints, 5 folds × 5 seeds</text><text x="464.0" y="318.0" class="cat" text-anchor="start">performance governed by which participants are held out</text><rect x="452" y="352" width="390" height="56" rx="4" fill="var(--surface)" stroke="var(--s1)" stroke-width="1.5"/><text x="464" y="372" fill="var(--ink)" font-size="12.5" font-weight="600">Endpoint, read once</text><text x="464.0" y="389.0" class="cat" text-anchor="start">0.7551 mean per-participant AP  (99% 0.7368–0.7721)</text><text x="464.0" y="404.0" class="cat" text-anchor="start">leakage-free 0.7056 — both reported</text><path d="M492 218 L492 262" stroke="var(--axis)" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M492 322 L492 348" stroke="var(--axis)" stroke-width="1.5" fill="none" marker-end="url(#a)"/><rect x="452" y="438" width="390" height="56" rx="4" fill="var(--surface)" stroke="var(--grid)" stroke-width="1"/><text x="464" y="458" fill="var(--ink)" font-size="12.5" font-weight="600">Comparison with published predictors</text><text x="464.0" y="475.0" class="cat" text-anchor="start">165,594 rows naive to every system</text><text x="464.0" y="490.0" class="cat" text-anchor="start">four predictors span 0.0046; the CNN leads by 0.137–0.142</text><path d="M492 408 L492 434" stroke="var(--axis)" stroke-width="1.5" fill="none" marker-end="url(#a)"/><text x="28.0" y="586.0" class="note" text-anchor="start">Sources: data/derived/FREEZE.json, SPLIT.csv, FILE_MAP.csv; results/model/selection.json, final.json, endpoint.json; results/qc/leakage_audit.json.</text><text x="28.0" y="602.0" class="note" text-anchor="start">The realised split leaks 15.99%, near the top of the 11.76–17.25% range; the leakage-free subset is reported alongside the primary.</text></svg>