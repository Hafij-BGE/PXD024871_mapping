<svg xmlns="http://www.w3.org/2000/svg" width="880" height="600" viewBox="0 0 880 600" class="viz" role="img" aria-labelledby="t d"><title id="t">Four confounds measured before any model was fitted</title><desc id="d">Composition floor 0.597 average precision against a 0.500 chance baseline and a 0.7551 endpoint; sequence leakage 15.99 percent on the realised split within an 11.76 to 17.25 percent range over 2000 random splits; acquisition platform separable at AUROC 0.6451 against a 0.5150 control; 11.78 percent of constructed decoys called presented by an independent predictor.</desc><defs><style>
  .viz{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;
       --grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;
       --s1lo:#86b6ef;--neg:#e34948;
       font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  @media (prefers-color-scheme:dark){
    .viz:not([data-theme="light"]){--surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;
       --muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;
       --s3:#199e70;--s1lo:#184f95;--neg:#e66767}}
  .viz[data-theme="dark"]{--surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;
       --muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;
       --s3:#199e70;--s1lo:#184f95;--neg:#e66767}
  .bg{fill:var(--surface)}
  .ttl{fill:var(--ink);font-size:15px;font-weight:600}
  .sub{fill:var(--ink2);font-size:11.5px}
  .cat{fill:var(--ink);font-size:12px}
  .val{fill:var(--ink);font-size:11.5px;font-weight:600;
       font-variant-numeric:tabular-nums}
  .ci{fill:var(--ink2);font-size:10.5px;font-variant-numeric:tabular-nums}
  .tick{fill:var(--muted);font-size:10.5px;font-variant-numeric:tabular-nums}
  .note{fill:var(--muted);font-size:10.5px}
  .ref{fill:var(--ink2);font-size:10.5px;font-weight:600}
  .grid{stroke:var(--grid);stroke-width:1}
  .axis{stroke:var(--axis);stroke-width:1}
  .refline{stroke:var(--axis);stroke-width:1}
  .ring{stroke:var(--surface);stroke-width:2}
</style></defs><rect class="bg" width="880" height="600"/><text x="28.0" y="26.0" class="ttl" text-anchor="start">Four properties of the data, measured before any model was fitted</text><text x="28.0" y="46.0" class="sub" text-anchor="start">Each bounds what the endpoint can mean. All four are cheap to compute and all four move the headline number.</text><text x="28" y="82" fill="var(--ink)" font-size="12.5" font-weight="600">A  Performance is not read against chance</text><text x="28.0" y="99.0" class="sub" text-anchor="start">Amino-acid composition alone, no positional information</text><rect x="28" y="132" width="51.4" height="16" fill="var(--muted)" rx="2"/><text x="28.0" y="128.0" class="cat" text-anchor="start">chance</text><text x="86.4" y="145.0" class="val" text-anchor="start">0.5000</text><rect x="28" y="166" width="151.2" height="16" fill="var(--s2)" rx="2"/><text x="28.0" y="162.0" class="cat" text-anchor="start">composition floor</text><text x="186.2" y="179.0" class="val" text-anchor="start">0.5970</text><rect x="28" y="200" width="262.9" height="16" fill="var(--s1lo)" rx="2"/><text x="28.0" y="196.0" class="cat" text-anchor="start">endpoint, leakage-free</text><text x="297.9" y="213.0" class="val" text-anchor="start">0.7056</text><rect x="28" y="234" width="313.8" height="16" fill="var(--s1)" rx="2"/><text x="28.0" y="230.0" class="cat" text-anchor="start">endpoint</text><text x="348.8" y="247.0" class="val" text-anchor="start">0.7551</text><line x1="179.2" y1="126" x2="179.2" y2="248" stroke="var(--axis)" stroke-width="1" stroke-dasharray="3 3"/><text x="28.0" y="270.0" class="note" text-anchor="start">Over half the apparent discrimination is reachable without sequence structure.</text><text x="456" y="82" fill="var(--ink)" font-size="12.5" font-weight="600">B  Participant-disjoint is not sequence-disjoint</text><text x="456.0" y="99.0" class="sub" text-anchor="start">2,000 random ten-participant splits</text><line x1="492.7" y1="160" x2="756.2" y2="160" class="axis"/><rect x="558.8" y="149" width="135.2" height="22" fill="var(--s1lo)" rx="2"/><line x1="629.8" y1="147" x2="629.8" y2="173" stroke="var(--axis)" stroke-width="2"/><circle cx="695.4" cy="160" r="6" fill="var(--s2)" class="ring"/><text x="492.7" y="190.0" class="tick" text-anchor="middle">11.76%</text><text x="756.2" y="190.0" class="tick" text-anchor="middle">17.25%</text><text x="629.8" y="140.0" class="tick" text-anchor="middle">median 14.62%</text><text x="695.4" y="212.0" class="val" text-anchor="middle">realised split 15.99%</text><text x="456.0" y="248.0" class="note" text-anchor="start">Shaded: 5th–95th percentile. The realised split was not re-drawn —</text><text x="456.0" y="264.0" class="note" text-anchor="start">choosing a split on its leakage would be selection on the data.</text><text x="456.0" y="284.0" class="note" text-anchor="start">Cost of the leaked rows: 0.0495 average precision.</text><text x="28" y="342" fill="var(--ink)" font-size="12.5" font-weight="600">C  The acquisition platform is learnable from sequence</text><text x="28.0" y="359.0" class="sub" text-anchor="start">Composition-only classifier, LTQ Orbitrap XL vs Orbitrap Fusion Lumos</text><rect x="28" y="394" width="57.2" height="18" fill="var(--muted)" rx="2"/><text x="28.0" y="389.0" class="cat" text-anchor="start">control: random halves of participants</text><text x="92.2" y="408.0" class="val" text-anchor="start">0.5150</text><rect x="28" y="434" width="270.1" height="18" fill="var(--s3)" rx="2"/><text x="28.0" y="429.0" class="cat" text-anchor="start">platform</text><text x="305.1" y="448.0" class="val" text-anchor="start">0.6451</text><text x="28.0" y="496.0" class="ref" text-anchor="start">excess attributable to platform  +0.1301</text><text x="28.0" y="516.0" class="note" text-anchor="start">No participant spans both platforms, so no split over</text><text x="28.0" y="532.0" class="note" text-anchor="start">participants can separate the two.</text><text x="456" y="342" fill="var(--ink)" font-size="12.5" font-weight="600">D  The negative class is contaminated</text><text x="456.0" y="359.0" class="sub" text-anchor="start">Independent predictor scoring the constructed decoys</text><rect x="456" y="388" width="13" height="13" fill="var(--neg)" rx="2"/><rect x="473" y="388" width="13" height="13" fill="var(--neg)" rx="2"/><rect x="490" y="388" width="13" height="13" fill="var(--neg)" rx="2"/><rect x="507" y="388" width="13" height="13" fill="var(--neg)" rx="2"/><rect x="524" y="388" width="13" height="13" fill="var(--neg)" rx="2"/><rect x="541" y="388" width="13" height="13" fill="var(--neg)" rx="2"/><rect x="558" y="388" width="13" height="13" fill="var(--neg)" rx="2"/><rect x="575" y="388" width="13" height="13" fill="var(--neg)" rx="2"/><rect x="592" y="388" width="13" height="13" fill="var(--neg)" rx="2"/><rect x="609" y="388" width="13" height="13" fill="var(--neg)" rx="2"/><rect x="626" y="388" width="13" height="13" fill="var(--neg)" rx="2"/><rect x="643" y="388" width="13" height="13" fill="var(--neg)" rx="2"/><rect x="660" y="388" width="13" height="13" fill="var(--neg)" rx="2"/><rect x="677" y="388" width="13" height="13" fill="var(--neg)" rx="2"/><rect x="694" y="388" width="13" height="13" fill="var(--neg)" rx="2"/><rect x="711" y="388" width="13" height="13" fill="var(--neg)" rx="2"/><rect x="728" y="388" width="13" height="13" fill="var(--neg)" rx="2"/><rect x="745" y="388" width="13" height="13" fill="var(--neg)" rx="2"/><rect x="762" y="388" width="13" height="13" fill="var(--neg)" rx="2"/><rect x="779" y="388" width="13" height="13" fill="var(--neg)" rx="2"/><rect x="456" y="405" width="13" height="13" fill="var(--neg)" rx="2"/><rect x="473" y="405" width="13" height="13" fill="var(--grid)" rx="2"/><rect x="490" y="405" width="13" height="13" fill="var(--grid)" rx="2"/><rect x="507" y="405" width="13" height="13" fill="var(--grid)" rx="2"/><rect x="524" y="405" width="13" height="13" fill="var(--grid)" rx="2"/