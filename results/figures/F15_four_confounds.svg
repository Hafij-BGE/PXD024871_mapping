="728" y="490" width="13" height="13" fill="var(--grid)" rx="2"/><rect x="745" y="490" width="13" height="13" fill="var(--grid)" rx="2"/><rect x="762" y="490" width="13" height="13" fill="var(--grid)" rx="2"/><rect x="779" y="490" width="13" height="13" fill="var(--grid)" rx="2"/><rect x="456" y="507" width="13" height="13" fill="var(--grid)" rx="2"/><rect x="473" y="507" width="13" height="13" fill="var(--grid)" rx="2"/><rect x="490" y="507" width="13" height="13" fill="var(--grid)" rx="2"/><rect x="507" y="507" width="13" height="13" fill="var(--grid)" rx="2"/><rect x="524" y="507" width="13" height="13" fill="var(--grid)" rx="2"/><rect x="541" y="507" width="13" height="13" fill="var(--grid)" rx="2"/><rect x="558" y="507" width="13" height="13" fill="var(--grid)" rx="2"/><rect x="575" y="507" width="13" height="13" fill="var(--grid)" rx="2"/><rect x="592" y="507" width="13" height="13" fill="var(--grid)" rx="2"/><rect x="609" y="507" width="13" height="13" fill="var(--grid)" rx="2"/><rect x="626" y="507" width="13" height="13" fill="var(--grid)" rx="2"/><rect x="643" y="507" width="13" height="13" fill="var(--grid)" rx="2"/><rect x="660" y="507" width="13" height="13" fill="var(--grid)" rx="2"/><rect x="677" y="507" width="13" height="13" fill="var(--grid)" rx="2"/><rect x="694" y="507" width="13" height="13" fill="var(--grid)" rx="2"/><rect x="711" y="507" width="13" height="13" fill="var(--grid)" rx="2"/><rect x="728" y="507" width="13" height="13" fill="var(--grid)" rx="2"/><rect x="745" y="507" width="13" height="13" fill="var(--grid)" rx="2"/><rect x="762" y="507" width="13" height="13" fill="var(--grid)" rx="2"/><rect x="779" y="507" width="13" height="13" fill="var(--grid)" rx="2"/><rect x="456" y="524" width="13" height="13" fill="var(--grid)" rx="2"/><rect x="473" y="524" width="13" height="13" fill="var(--grid)" rx="2"/><rect x="490" y="524" width="13" height="13" fill="var(--grid)" rx="2"/><rect x="507" y="524" width="13" height="13" fill="var(--grid)"