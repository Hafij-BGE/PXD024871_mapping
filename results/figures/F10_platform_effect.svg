<svg xmlns="http://www.w3.org/2000/svg" width="880" height="307" viewBox="0 0 880 307" class="viz" role="img" aria-labelledby="t d"><title id="t">The platform effect is real, bounded, and agrees across two designs</title><desc id="d">One contrast holds the model fixed and moves the test platform; the other holds the test units fixed and moves the training platform.</desc><defs><style>
  .viz{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;
       --grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;
       --s1lo:#86b6ef;--neg:#e34948;
       font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  @media (prefers-color-scheme:dark){
    .viz:not([data-theme="light"]){--surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;
       --muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;
       --s3:#199e70;--s1lo:#184f95;--neg:#e66767}}
  .viz[data-theme="dark"]{--surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;
       --muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;
       --s3:#199e70;--s1lo:#184f95;--neg:#e66767}
  .bg{fill:var(--surface)}
  .ttl{fill:var(--ink);font-size:15px;font-weight:600}
  .sub{fill:var(--ink2);font-size:11.5px}
  .cat{fill:var(--ink);font-size:12px}
  .val{fill:var(--ink);font-size:11.5px;font-weight:600;
       font-variant-numeric:tabular-nums}
  .ci{fill:var(--ink2);font-size:10.5px;font-variant-numeric:tabular-nums}
  .tick{fill:var(--muted);font-size:10.5px;font-variant-numeric:tabular-nums}
  .note{fill:var(--muted);font-size:10.5px}
  .ref{fill:var(--ink2);font-size:10.5px;font-weight:600}
  .grid{stroke:var(--grid);stroke-width:1}
  .axis{stroke:var(--axis);stroke-width:1}
  .refline{stroke:var(--axis);stroke-width:1}
  .ring{stroke:var(--surface);stroke-width:2}
</style></defs><rect class="bg" width="880" height="307"/><text x="28.0" y="26.0" class="ttl" text-anchor="start">The platform effect is real, bounded, and agrees across two designs</text><text x="28.0" y="44.0" class="sub" text-anchor="start">One contrast holds the model fixed and moves the test platform; the other holds the test units fixed and moves the training platform.</text><line class="grid" x1="394.9" y1="81.0" x2="394.9" y2="223.0"/><text x="394.9" y="238.0" class="tick" text-anchor="middle">0</text><line class="grid" x1="463.6" y1="81.0" x2="463.6" y2="223.0"/><text x="463.6" y="238.0" class="tick" text-anchor="middle">0.025</text><line class="grid" x1="532.3" y1="81.0" x2="532.3" y2="223.0"/><text x="532.3" y="238.0" class="tick" text-anchor="middle">0.05</text><line class="grid" x1="600.9" y1="81.0" x2="600.9" y2="223.0"/><text x="600.9" y="238.0" class="tick" text-anchor="middle">0.075</text><line class="grid" x1="669.6" y1="81.0" x2="669.6" y2="223.0"/><text x="669.6" y="238.0" class="tick" text-anchor="middle">0.1</text><line class="grid" x1="738.3" y1="81.0" x2="738.3" y2="223.0"/><text x="738.3" y="238.0" class="tick" text-anchor="middle">0.125</text><line class="axis" x1="340" y1="223.0" x2="752" y2="223.0"/><text x="546.0" y="254.0" class="note" text-anchor="middle">cost of training on the other platform (AP)</text><line class="refline" x1="394.9" y1="79.0" x2="394.9" y2="223.0"/><text x="394.9" y="75.0" class="ref" text-anchor="middle">no effect</text><line x1="461.8" y1="105.0" x2="663.9" y2="105.0" stroke="var(--s1)" stroke-width="2" stroke-linecap="round"/><circle cx="560.1" cy="105.0" r="4.5" fill="var(--s1)" class="ring"/><text x="322.0" y="109.0" class="cat" text-anchor="end">same model, test platform moves — M_LTQ</text><text x="762.0" y="106.0" class="val" text-anchor="start">+0.0601</text><text x="762.0" y="118.0" class="ci" text-anchor="start">[+0.0243, +0.0979]</text><line x1="449.9" y1="137.0" x2="568.2" y2="137.0" stroke="var(--s1)" stroke-width="2" stroke-linecap="round"/><circle cx="508.7" cy="137.0" r="4.5" fill="var(--s1)" class="ring"/><text x="322.0" y="141.0" class="cat" text-anchor="end">same model, test platform moves — M_Lumos</text><text x="762.0" y="138.0" class="val" text-anchor="start">+0.0414</text><text x="762.0" y="150.0" class="ci" text-anchor="start">[+0.0200, +0.0631]</text><line x1="466.7" y1="169.0" x2="599.5" y2="169.0" stroke="var(--s1)" stroke-width="2" stroke-linecap="round"/><circle cx="536.5" cy="169.0" r="4.5" fill="var(--s1)" class="ring"/><text x="322.0" y="173.0" class="cat" text-anchor="end">same test units, training platform moves — LTQ held-out half</text><text x="762.0" y="170.0" class="val" text-anchor="start">+0.0516</text><text x="762.0" y="182.0" class="ci" text-anchor="start">[+0.0261, +0.0745]</text><line x1="475.9" y1="201.0" x2="598.4" y2="201.0" stroke="var(--s1)" stroke-width="2" stroke-linecap="round"/><circle cx="532.3" cy="201.0" r="4.5" fill="var(--s1)" class="ring"/><text x="322.0" y="205.0" class="cat" text-anchor="end">same test units, training platform moves — Lumos held-out half</text><text x="762.0" y="202.0" class="val" text-anchor="start">+0.0500</text><text x="762.0" y="214.0" class="ci" text-anchor="start">[+0.0295, +0.0741]</text><text x="28.0" y="267.0" class="note" text-anchor="start">Four estimates from two designs, agreeing to within 0.01, none of the intervals containing zero. Training on the other platform costs 0.04–0.06</text><text x="28.0" y="281.0" class="note" text-anchor="start">average precision — a cost, not a collapse.</text></svg>