<svg xmlns="http://www.w3.org/2000/svg" width="880" height="390" viewBox="0 0 880 390" class="viz" role="img" aria-labelledby="t d"><title id="t">Cross-platform transfer does not collapse</title><desc id="d">Each arm against its OWN composition-only floor, fitted on that arm’s own training rows. Arm floors span 0.5917 to 0.6648, so the pooled 0.597 would reverse the ordering between arms.</desc><defs><style>
  .viz{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;
       --grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;
       --s1lo:#86b6ef;--neg:#e34948;
       font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  @media (prefers-color-scheme:dark){
    .viz:not([data-theme="light"]){--surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;
       --muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;
       --s3:#199e70;--s1lo:#184f95;--neg:#e66767}}
  .viz[data-theme="dark"]{--surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;
       --muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;
       --s3:#199e70;--s1lo:#184f95;--neg:#e66767}
  .bg{fill:var(--surface)}
  .ttl{fill:var(--ink);font-size:15px;font-weight:600}
  .sub{fill:var(--ink2);font-size:11.5px}
  .cat{fill:var(--ink);font-size:12px}
  .val{fill:var(--ink);font-size:11.5px;font-weight:600;
       font-variant-numeric:tabular-nums}
  .ci{fill:var(--ink2);font-size:10.5px;font-variant-numeric:tabular-nums}
  .tick{fill:var(--muted);font-size:10.5px;font-variant-numeric:tabular-nums}
  .note{fill:var(--muted);font-size:10.5px}
  .ref{fill:var(--ink2);font-size:10.5px;font-weight:600}
  .grid{stroke:var(--grid);stroke-width:1}
  .axis{stroke:var(--axis);stroke-width:1}
  .refline{stroke:var(--axis);stroke-width:1}
  .ring{stroke:var(--surface);stroke-width:2}
</style></defs><rect class="bg" width="880" height="390"/><text x="28.0" y="26.0" class="ttl" text-anchor="start">Cross-platform transfer does not collapse</text><text x="28.0" y="44.0" class="sub" text-anchor="start">Each arm against its OWN composition-only floor, fitted on that arm’s own training rows. Arm floors span 0.5917 to 0.6648, so the pooled</text><text x="28.0" y="59.0" class="sub" text-anchor="start">0.597 would reverse the ordering between arms.</text><circle cx="300.0" cy="88.0" r="4.5" fill="var(--s1lo)" class="ring"/><text x="312.0" y="92.0" class="sub" text-anchor="start">arm's own composition floor</text><circle cx="506.0" cy="88.0" r="4.5" fill="var(--s1)" class="ring"/><text x="518.0" y="92.0" class="sub" text-anchor="start">CNN, same rows</text><line class="grid" x1="404.8" y1="108.0" x2="404.8" y2="306.0"/><text x="404.8" y="321.0" class="tick" text-anchor="middle">0.6</text><line class="grid" x1="491.6" y1="108.0" x2="491.6" y2="306.0"/><text x="491.6" y="321.0" class="tick" text-anchor="middle">0.65</text><line class="grid" x1="578.4" y1="108.0" x2="578.4" y2="306.0"/><text x="578.4" y="321.0" class="tick" text-anchor="middle">0.7</text><line class="grid" x1="665.2" y1="108.0" x2="665.2" y2="306.0"/><text x="665.2" y="321.0" class="tick" text-anchor="middle">0.75</text><line class="axis" x1="318" y1="306.0" x2="752" y2="306.0"/><text x="535.0" y="337.0" class="note" text-anchor="middle">mean per-participant average precision</text><text x="762.0" y="102.0" class="note" text-anchor="start">lift</text><line x1="390.4" y1="124.0" x2="571.3" y2="124.0" stroke="var(--s1lo)" stroke-width="2" stroke-linecap="round"/><circle cx="390.4" cy="124.0" r="4.5" fill="var(--s1lo)" class="ring"/><circle cx="571.3" cy="124.0" r="4.5" fill="var(--s1)" class="ring"/><text x="300.0" y="128.0" class="cat" text-anchor="end">LTQ-trained → all 27 Lumos</text><text x="762.0" y="128.0" class="val" text-anchor="start">+0.1042</text><line x1="421.0" y1="156.0" x2="597.1" y2="156.0" stroke="var(--s1lo)" stroke-width="2" stroke-linecap="round"/><circle cx="421.0" cy="156.0" r="4.5" fill="var(--s1lo)" class="ring"/><circle cx="597.1" cy="156.0" r="4.5" fill="var(--s1)" class="ring"/><text x="300.0" y="160.0" class="cat" text-anchor="end">Lumos-trained → all 25 LTQ</text><text x="762.0" y="160.0" class="val" text-anchor="start">+0.1015</text><line x1="517.2" y1="188.0" x2="661.9" y2="188.0" stroke="var(--s1lo)" stroke-width="2" stroke-linecap="round"/><circle cx="517.2" cy="188.0" r="4.5" fill="var(--s1lo)" class="ring"/><circle cx="661.9" cy="188.0" r="4.5" fill="var(--s1)" class="ring"/><text x="300.0" y="192.0" class="cat" text-anchor="end">LTQ-trained → LTQ held-out half</text><text x="762.0" y="192.0" class="val" text-anchor="start">+0.0833</text><line x1="390.7" y1="220.0" x2="557.5" y2="220.0" stroke="var(--s1lo)" stroke-width="2" stroke-linecap="round"/><circle cx="390.7" cy="220.0" r="4.5" fill="var(--s1lo)" class="ring"/><circle cx="557.5" cy="220.0" r="4.5" fill="var(--s1)" class="ring"/><text x="300.0" y="224.0" class="cat" text-anchor="end">LTQ-trained → Lumos held-out half</text><text x="762.0" y="224.0" class="val" text-anchor="start">+0.0961</text><line x1="432.2" y1="252.0" x2="644.3" y2="252.0" stroke="var(--s1lo)" stroke-width="2" stroke-linecap="round"/><circle cx="432.2" cy="252.0" r="4.5" fill="var(--s1lo)" class="ring"/><circle cx="644.3" cy="252.0" r="4.5" fill="var(--s1)" class="ring"/><text x="300.0" y="256.0" class="cat" text-anchor="end">Lumos-trained → Lumos held-out half</text><text x="762.0" y="256.0" class="val" text-anchor="start">+0.1221</text><line x1="422.6" y1="284.0" x2="572.4" y2="284.0" stroke="var(--s1lo)" stroke-width="2" stroke-linecap="round"/><circle cx="422.6" cy="284.0" r="4.5" fill="var(--s1lo)" class="ring"/><circle cx="572.4" cy="284.0" r="4.5" fill="var(--s1)" class="ring"/><text x="300.0" y="288.0" class="cat" text-anchor="end">Lumos-trained → LTQ held-out half</text><text x="762.0" y="288.0" class="val" text-anchor="start">+0.0863</text><text x="28.0" y="350.0" class="note" text-anchor="start">A model that has never seen a run from the target instrument still sits about 0.10 above the composition floor for that pairing. The first two rows</text><text x="28.0" y="364.0" class="note" text-anchor="start">are the preregistered arms (D025); the last four are the matched control that separates platform from training-set size (D028).</text></svg>