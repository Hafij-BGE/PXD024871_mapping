<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450" class="viz" role="img" aria-labelledby="t d"><title id="t">The symmetric test: each model wins on its own allele’s peptides</title><desc id="d">Both arms are carrier-trained — each for its own allele — so neither group is defined by an absence, which is what made the earlier design uninformative. A sign reversal was preregistered as the signature.</desc><defs><style>
  .viz{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;
       --grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;
       --s1lo:#86b6ef;--neg:#e34948;
       font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  @media (prefers-color-scheme:dark){
    .viz:not([data-theme="light"]){--surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;
       --muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;
       --s3:#199e70;--s1lo:#184f95;--neg:#e66767}}
  .viz[data-theme="dark"]{--surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;
       --muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;
       --s3:#199e70;--s1lo:#184f95;--neg:#e66767}
  .bg{fill:var(--surface)}
  .ttl{fill:var(--ink);font-size:15px;font-weight:600}
  .sub{fill:var(--ink2);font-size:11.5px}
  .cat{fill:var(--ink);font-size:12px}
  .val{fill:var(--ink);font-size:11.5px;font-weight:600;
       font-variant-numeric:tabular-nums}
  .ci{fill:var(--ink2);font-size:10.5px;font-variant-numeric:tabular-nums}
  .tick{fill:var(--muted);font-size:10.5px;font-variant-numeric:tabular-nums}
  .note{fill:var(--muted);font-size:10.5px}
  .ref{fill:var(--ink2);font-size:10.5px;font-weight:600}
  .grid{stroke:var(--grid);stroke-width:1}
  .axis{stroke:var(--axis);stroke-width:1}
  .refline{stroke:var(--axis);stroke-width:1}
  .ring{stroke:var(--surface);stroke-width:2}
</style></defs><rect class="bg" width="880" height="450"/><text x="28.0" y="26.0" class="ttl" text-anchor="start">The symmetric test: each model wins on its own allele’s peptides</text><text x="28.0" y="44.0" class="sub" text-anchor="start">Both arms are carrier-trained — each for its own allele — so neither group is defined by an absence, which is what made the earlier</text><text x="28.0" y="59.0" class="sub" text-anchor="start">design uninformative. A sign reversal was preregistered as the signature.</text><circle cx="300.0" cy="88.0" r="4.5" fill="var(--s1)" class="ring"/><text x="312.0" y="92.0" class="sub" text-anchor="start">HLA-A*02:01-trained</text><circle cx="455.0" cy="88.0" r="4.5" fill="var(--s2)" class="ring"/><text x="467.0" y="92.0" class="sub" text-anchor="start">HLA-C*07:02-trained</text><line class="grid" x1="240" y1="284.7" x2="750" y2="284.7"/><text x="232.0" y="288.7" class="tick" text-anchor="end">0.77</text><line class="grid" x1="240" y1="253.0" x2="750" y2="253.0"/><text x="232.0" y="257.0" class="tick" text-anchor="end">0.78</text><line class="grid" x1="240" y1="221.3" x2="750" y2="221.3"/><text x="232.0" y="225.3" class="tick" text-anchor="end">0.79</text><line class="grid" x1="240" y1="189.7" x2="750" y2="189.7"/><text x="232.0" y="193.7" class="tick" text-anchor="end">0.8</text><line class="grid" x1="240" y1="158.0" x2="750" y2="158.0"/><text x="232.0" y="162.0" class="tick" text-anchor="end">0.81</text><line class="grid" x1="240" y1="126.3" x2="750" y2="126.3"/><text x="232.0" y="130.3" class="tick" text-anchor="end">0.82</text><text x="232.0" y="106.0" class="note" text-anchor="end">mean per-participant AP</text><text x="330.0" y="334.0" class="cat" text-anchor="middle">HLA-A*02:01-exclusive stratum (9 participants)</text><text x="660.0" y="334.0" class="cat" text-anchor="middle">HLA-C*07:02-exclusive stratum (6 participants)</text><line x1="330" y1="137.4" x2="660" y2="181.8" stroke="var(--s1)" stroke-width="2" stroke-linecap="round"/><circle cx="330.0" cy="137.4" r="4.5" fill="var(--s1)" class="ring"/><circle cx="660.0" cy="181.8" r="4.5" fill="var(--s1)" class="ring"/><text x="316.0" y="141.4" class="val" text-anchor="end">0.8165</text><text x="674.0" y="185.8" class="val" text-anchor="start">0.8025</text><line x1="330" y1="284.0" x2="660" y2="154.3" stroke="var(--s2)" stroke-width="2" stroke-linecap="round"/><circle cx="330.0" cy="284.0" r="4.5" fill="var(--s2)" class="ring"/><circle cx="660.0" cy="154.3" r="4.5" fill="var(--s2)" class="ring"/><text x="316.0" y="288.0" class="val" text-anchor="end">0.7702</text><text x="674.0" y="158.3" class="val" text-anchor="start">0.8112</text><text x="28.0" y="366.0" class="note" text-anchor="start">The lines cross, so the sign reverses as preregistered.</text><text x="28.0" y="380.0" class="note" text-anchor="start">A*02:01-exclusive, adjusted for the neutral training-set difference: +0.0476, CI99 [+0.0314, +0.0626], 9 of 9 participants.</text><text x="28.0" y="394.0" class="note" text-anchor="start">C*07:02-exclusive, adjusted: -0.0049, CI99 [-0.0366, +0.0298] — correct sign, but the interval contains zero, so this direction is NOT demonstrated.</text><text x="28.0" y="408.0" class="note" text-anchor="start">Only one of the two directions is established. G13 was released on that basis by the project owner (D032), over a criterion that had required both —</text><text x="28.0" y="422.0" class="note" text-anchor="start">the single most reader-dependent step in this report.</text></svg>