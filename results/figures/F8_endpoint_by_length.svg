<svg xmlns="http://www.w3.org/2000/svg" width="880" height="354" viewBox="0 0 880 354" class="viz" role="img" aria-labelledby="t d"><title id="t">The endpoint is not carried by one peptide length</title><desc id="d">The same 200,000 rows and the same 25 models, split by length. Not a second reading: every length is reported, none is selected, the decision is fixed.</desc><defs><style>
  .viz{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;
       --grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;
       --s1lo:#86b6ef;--neg:#e34948;
       font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  @media (prefers-color-scheme:dark){
    .viz:not([data-theme="light"]){--surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;
       --muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;
       --s3:#199e70;--s1lo:#184f95;--neg:#e66767}}
  .viz[data-theme="dark"]{--surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;
       --muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;
       --s3:#199e70;--s1lo:#184f95;--neg:#e66767}
  .bg{fill:var(--surface)}
  .ttl{fill:var(--ink);font-size:15px;font-weight:600}
  .sub{fill:var(--ink2);font-size:11.5px}
  .cat{fill:var(--ink);font-size:12px}
  .val{fill:var(--ink);font-size:11.5px;font-weight:600;
       font-variant-numeric:tabular-nums}
  .ci{fill:var(--ink2);font-size:10.5px;font-variant-numeric:tabular-nums}
  .tick{fill:var(--muted);font-size:10.5px;font-variant-numeric:tabular-nums}
  .note{fill:var(--muted);font-size:10.5px}
  .ref{fill:var(--ink2);font-size:10.5px;font-weight:600}
  .grid{stroke:var(--grid);stroke-width:1}
  .axis{stroke:var(--axis);stroke-width:1}
  .refline{stroke:var(--axis);stroke-width:1}
  .ring{stroke:var(--surface);stroke-width:2}
</style></defs><rect class="bg" width="880" height="354"/><text x="28.0" y="26.0" class="ttl" text-anchor="start">The endpoint is not carried by one peptide length</text><text x="28.0" y="44.0" class="sub" text-anchor="start">The same 200,000 rows and the same 25 models, split by length. Not a second reading: every length is reported, none is selected, the</text><text x="28.0" y="59.0" class="sub" text-anchor="start">decision is fixed.</text><line class="grid" x1="349.5" y1="96.0" x2="349.5" y2="270.0"/><text x="349.5" y="285.0" class="tick" text-anchor="middle">0.65</text><line class="grid" x1="455.5" y1="96.0" x2="455.5" y2="270.0"/><text x="455.5" y="285.0" class="tick" text-anchor="middle">0.7</text><line class="grid" x1="561.4" y1="96.0" x2="561.4" y2="270.0"/><text x="561.4" y="285.0" class="tick" text-anchor="middle">0.75</text><line class="grid" x1="667.3" y1="96.0" x2="667.3" y2="270.0"/><text x="667.3" y="285.0" class="tick" text-anchor="middle">0.8</text><line class="axis" x1="286" y1="270.0" x2="752" y2="270.0"/><text x="519.0" y="301.0" class="note" text-anchor="middle">mean per-participant average precision</text><line class="refline" x1="343.2" y1="94.0" x2="343.2" y2="270.0"/><text x="343.2" y="90.0" class="ref" text-anchor="middle">threshold</text><line class="refline" x1="572.1" y1="108.0" x2="572.1" y2="270.0"/><text x="572.1" y="104.0" class="ref" text-anchor="middle">pooled 0.7551</text><line x1="538.7" y1="120.0" x2="649.1" y2="120.0" stroke="var(--s1)" stroke-width="2" stroke-linecap="round"/><circle cx="593.0" cy="120.0" r="4.5" fill="var(--s1)" class="ring"/><text x="268.0" y="124.0" class="cat" text-anchor="end">8-mer  (31,474 rows)</text><text x="762.0" y="121.0" class="val" text-anchor="start">0.7649</text><text x="762.0" y="133.0" class="ci" text-anchor="start">[0.7393, 0.7914]</text><line x1="535.6" y1="152.0" x2="643.9" y2="152.0" stroke="var(--s1)" stroke-width="2" stroke-linecap="round"/><circle cx="595.3" cy="152.0" r="4.5" fill="var(--s1)" class="ring"/><text x="268.0" y="156.0" class="cat" text-anchor="end">9-mer  (64,954 rows)</text><text x="762.0" y="153.0" class="val" text-anchor="start">0.7660</text><text x="762.0" y="165.0" class="ci" text-anchor="start">[0.7379, 0.7890]</text><line x1="461.7" y1="184.0" x2="575.0" y2="184.0" stroke="var(--s1)" stroke-width="2" stroke-linecap="round"/><circle cx="518.4" cy="184.0" r="4.5" fill="var(--s1)" class="ring"/><text x="268.0" y="188.0" class="cat" text-anchor="end">10-mer  (50,922 rows)</text><text x="762.0" y="185.0" class="val" text-anchor="start">0.7297</text><text x="762.0" y="197.0" class="ci" text-anchor="start">[0.7029, 0.7565]</text><line x1="492.7" y1="216.0" x2="588.2" y2="216.0" stroke="var(--s1)" stroke-width="2" stroke-linecap="round"/><circle cx="544.6" cy="216.0" r="4.5" fill="var(--s1)" class="ring"/><text x="268.0" y="220.0" class="cat" text-anchor="end">11-mer  (33,244 rows)</text><text x="762.0" y="217.0" class="val" text-anchor="start">0.7421</text><text x="762.0" y="229.0" class="ci" text-anchor="start">[0.7176, 0.7627]</text><line x1="578.7" y1="248.0" x2="677.2" y2="248.0" stroke="var(--s1)" stroke-width="2" stroke-linecap="round"/><circle cx="635.5" cy="248.0" r="4.5" fill="var(--s1)" class="ring"/><text x="268.0" y="252.0" class="cat" text-anchor="end">12-mer  (19,406 rows)</text><text x="762.0" y="249.0" class="val" text-anchor="start">0.7850</text><text x="762.0" y="261.0" class="ci" text-anchor="start">[0.7582, 0.8047]</text><text x="28.0" y="314.0" class="note" text-anchor="start">Every length clears the threshold. The best is the 12-mer — which is also the length D025 found most platform-discriminative, 11.69% of LTQ positives</text><text x="28.0" y="328.0" class="note" text-anchor="start">against 9.85% of Lumos. The coincidence runs in the unflattering direction and is recorded rather than left out.</text></svg>