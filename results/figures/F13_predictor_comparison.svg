<svg xmlns="http://www.w3.org/2000/svg" width="880" height="447" viewBox="0 0 880 447" class="viz" role="img" aria-labelledby="t d"><title id="t">The CNN leads MHCflurry where neither system has seen the rows</title><desc id="d">Identical rows for every system. The vertical rule in each band is that row set’s random baseline, which equals its prevalence.</desc><defs><style>
  .viz{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;
       --grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;
       --s1lo:#86b6ef;--neg:#e34948;
       font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  @media (prefers-color-scheme:dark){
    .viz:not([data-theme="light"]){--surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;
       --muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;
       --s3:#199e70;--s1lo:#184f95;--neg:#e66767}}
  .viz[data-theme="dark"]{--surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;
       --muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;
       --s3:#199e70;--s1lo:#184f95;--neg:#e66767}
  .bg{fill:var(--surface)}
  .ttl{fill:var(--ink);font-size:15px;font-weight:600}
  .sub{fill:var(--ink2);font-size:11.5px}
  .cat{fill:var(--ink);font-size:12px}
  .val{fill:var(--ink);font-size:11.5px;font-weight:600;
       font-variant-numeric:tabular-nums}
  .ci{fill:var(--ink2);font-size:10.5px;font-variant-numeric:tabular-nums}
  .tick{fill:var(--muted);font-size:10.5px;font-variant-numeric:tabular-nums}
  .note{fill:var(--muted);font-size:10.5px}
  .ref{fill:var(--ink2);font-size:10.5px;font-weight:600}
  .grid{stroke:var(--grid);stroke-width:1}
  .axis{stroke:var(--axis);stroke-width:1}
  .refline{stroke:var(--axis);stroke-width:1}
  .ring{stroke:var(--surface);stroke-width:2}
</style></defs><rect class="bg" width="880" height="447"/><text x="28.0" y="26.0" class="ttl" text-anchor="start">The CNN leads MHCflurry where neither system has seen the rows</text><text x="28.0" y="44.0" class="sub" text-anchor="start">Identical rows for every system. The vertical rule in each band is that row set’s random baseline, which equals its prevalence.</text><circle cx="300.0" cy="73.0" r="4.5" fill="var(--s1)" class="ring"/><text x="312.0" y="77.0" class="sub" text-anchor="start">CNN (this work)</text><circle cx="450.0" cy="73.0" r="4.5" fill="var(--s2)" class="ring"/><text x="462.0" y="77.0" class="sub" text-anchor="start">MHCflurry 2.0.0</text><circle cx="600.0" cy="73.0" r="4.5" fill="var(--s3)" class="ring"/><text x="612.0" y="77.0" class="sub" text-anchor="start">MHCflurry 2.3.0</text><line class="grid" x1="352.3" y1="95.0" x2="352.3" y2="349.0"/><text x="352.3" y="364.0" class="tick" text-anchor="middle">0.45</text><line class="grid" x1="409.4" y1="95.0" x2="409.4" y2="349.0"/><text x="409.4" y="364.0" class="tick" text-anchor="middle">0.5</text><line class="grid" x1="466.5" y1="95.0" x2="466.5" y2="349.0"/><text x="466.5" y="364.0" class="tick" text-anchor="middle">0.55</text><line class="grid" x1="523.6" y1="95.0" x2="523.6" y2="349.0"/><text x="523.6" y="364.0" class="tick" text-anchor="middle">0.6</text><line class="grid" x1="580.7" y1="95.0" x2="580.7" y2="349.0"/><text x="580.7" y="364.0" class="tick" text-anchor="middle">0.65</text><line class="grid" x1="637.8" y1="95.0" x2="637.8" y2="349.0"/><text x="637.8" y="364.0" class="tick" text-anchor="middle">0.7</text><line class="grid" x1="694.9" y1="95.0" x2="694.9" y2="349.0"/><text x="694.9" y="364.0" class="tick" text-anchor="middle">0.75</text><line class="axis" x1="318" y1="349.0" x2="752" y2="349.0"/><text x="535.0" y="380.0" class="note" text-anchor="middle">mean per-participant average precision</text><text x="300.0" y="115.0" class="cat" text-anchor="end">Mutually naive · primary · 175,524 rows</text><text x="300.0" y="131.0" class="note" text-anchor="end">random baseline 0.440</text><line class="refline" x1="340.9" y1="103.0" x2="340.9" y2="167.0"/><line x1="603.9" y1="111.0" x2="640.0" y2="111.0" stroke="var(--s1)" stroke-width="2" stroke-linecap="round"/><circle cx="621.7" cy="111.0" r="4.5" fill="var(--s1)" class="ring"/><text x="762.0" y="115.0" class="val" text-anchor="start">0.6859</text><line x1="448.5" y1="135.0" x2="483.1" y2="135.0" stroke="var(--s2)" stroke-width="2" stroke-linecap="round"/><circle cx="464.3" cy="135.0" r="4.5" fill="var(--s2)" class="ring"/><text x="762.0" y="139.0" class="val" text-anchor="start">0.5481</text><line x1="453.0" y1="159.0" x2="488.0" y2="159.0" stroke="var(--s3)" stroke-width="2" stroke-linecap="round"/><circle cx="468.7" cy="159.0" r="4.5" fill="var(--s3)" class="ring"/><text x="762.0" y="163.0" class="val" text-anchor="start">0.5519</text><text x="300.0" y="201.0" class="cat" text-anchor="end">Predictor-naive only · 187,764 rows</text><text x="300.0" y="217.0" class="note" text-anchor="end">random baseline 0.477</text><line class="refline" x1="382.5" y1="189.0" x2="382.5" y2="253.0"/><line x1="650.1" y1="197.0" x2="694.5" y2="197.0" stroke="var(--s1)" stroke-width="2" stroke-linecap="round"/><circle cx="670.4" cy="197.0" r="4.5" fill="var(--s1)" class="ring"/><text x="762.0" y="201.0" class="val" text-anchor="start">0.7285</text><line x1="493.8" y1="221.0" x2="528.4" y2="221.0" stroke="var(--s2)" stroke-width="2" stroke-linecap="round"/><circle cx="511.2" cy="221.0" r="4.5" fill="var(--s2)" class="ring"/><text x="762.0" y="225.0" class="val" text-anchor="start">0.5892</text><line x1="496.5" y1="245.0" x2="537.4" y2="245.0" stroke="var(--s3)" stroke-width="2" stroke-linecap="round"/><circle cx="516.5" cy="245.0" r="4.5" fill="var(--s3)" class="ring"/><text x="762.0" y="249.0" class="val" text-anchor="start">0.5938</text><text x="300.0" y="287.0" class="cat" text-anchor="end">Full test partition · 199,978 rows</text><text x="300.0" y="303.0" class="note" text-anchor="end">random baseline 0.500</text><line class="refline" x1="409.3" y1="275.0" x2="409.3" y2="339.0"/><line x1="680.7" y1="283.0" x2="719.5" y2="283.0" stroke="var(--s1)" stroke-width="2" stroke-linecap="round"/><circle cx="700.7" cy="283.0" r="4.5" fill="var(--s1)" class="ring"/><text x="762.0" y="287.0" class="val" text-anchor="start">0.7551</text><line x1="556.8" y1="307.0" x2="634.7" y2="307.0" stroke="var(--s2)" stroke-width="2" stroke-linecap="round"/><circle cx="595.4" cy="307.0" r="4.5" fill="var(--s2)" class="ring"/><text x="762.0" y="311.0" class="val" text-anchor="start">0.6629</text><line x1="561.5" y1="331.0" x2="637.9" y2="331.0" stroke="var(--s3)" stroke-width="2" stroke-linecap="round"/><circle cx="600.5" cy="331.0" r="4.5" fill="var(--s3)" class="ring"/><text x="762.0" y="335.0" class="val" text-anchor="start">0.6673</text><text x="28.0" y="393.0" class="note" text-anchor="start">The lead is largest where contamination is smallest (+0.1378 and +0.1340), so it is not produced by memorisation. Prevalence differs by row set, so</text><text x="28.0" y="407.0" class="note" text-anchor="start">absolute values compare only within a band. The CNN also trained on this cohort’s own instruments and negative construction, which no subsetting</text><text x="28.0" y="421.0" class="note" text-anchor="start">removes.</text></svg>